<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Fale com o dono</title>
  <script>
    // O GitHub Pages e o Cloudflare Pages abrem este arquivo quando o endereço
    // não existe (ex.: /tambore). Ele manda para a página principal guardando
    // a loja, e a página principal volta o endereço para /tambore na barra.
    //
    // Quantas pastas vêm antes da loja no endereço:
    //  - usuario.github.io/NOME-DO-REPO/tambore  -> 1 (detectado sozinho)
    //  - domínio próprio ou *.pages.dev/tambore  -> 0
    var PASTAS_DO_SITE = /\.github\.io$/i.test(window.location.hostname) ? 1 : 0;

    var l = window.location;
    var partes = l.pathname.split("/");
    var base = partes.slice(0, 1 + PASTAS_DO_SITE).join("/") + "/";
    var resto = partes.slice(1 + PASTAS_DO_SITE).join("/");
    l.replace(l.protocol + "//" + l.host + base + "?u=" + encodeURIComponent(resto) + l.hash);
  </script>
</head>
<body></body>
</html>
