<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fale com o dono | Camarada Camarão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!-- Mesmo estilo do display de mesa: título condensado + "Dono" em pincel -->
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Yellowtail&display=swap" rel="stylesheet">
  <style>
    /* Fontes oficiais do Camarada (se os arquivos estiverem na pasta fonts/) */
    @font-face { font-family: "Westhouse"; src: url("fonts/Westhouse.ttf") format("truetype"); font-display: swap; }
    @font-face { font-family: "Akrobat"; src: url("fonts/Akrobat-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
    :root {
      --bg: #1a1310;      /* fundo escuro do display */
      --bg-2: #2a1d16;
      --cream: #f4ead9;   /* "Fale com o Dono" */
      --orange: #e8912d;  /* faixa e texto laranja */
      --qr: #1a1310;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(ellipse at center, var(--bg-2) 0%, var(--bg) 70%);
      color: var(--cream);
      font-family: "Oswald", "Arial Narrow", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-transform: uppercase;
    }

    /* Tablet deitado: título | seta | QR | frase */
    main {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3vw;
      width: 100%;
      max-height: 100%;
    }

    .titulo {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      flex: 0 1 auto;
    }
    .fale {
      font-family: "Akrobat", "Oswald", "Arial Narrow", sans-serif;
      font-size: min(6vh, 3.4vw);
      font-weight: 700;
      letter-spacing: .04em;
      line-height: 1;
      display: inline-flex;
      flex-direction: column;
      gap: .12em;
    }
    /* linha laranja com a curva no final, igual ao display */
    .fale svg {
      width: 100%;
      height: .45em;
      overflow: visible;
      color: var(--orange);
    }
    .dono {
      font-family: "Westhouse", "Yellowtail", cursive;
      text-transform: none;
      font-size: min(22vh, 12vw);
      line-height: .95;
      margin-top: -.05em;
    }
    .faixa {
      margin-top: 2vh;
      background: var(--orange);
      color: var(--bg);
      font-weight: 600;
      font-size: min(3.4vh, 1.9vw);
      line-height: 1.15;
      letter-spacing: .03em;
      padding: .6em .9em;
      max-width: 15em;
    }

    .seta {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .6vh;
      color: var(--orange);
    }
    .seta span {
      font-family: "Yellowtail", cursive;
      text-transform: none;
      font-size: min(5.5vh, 3vw);
      line-height: 1;
      white-space: nowrap;
    }
    .seta svg {
      width: min(13vh, 7.5vw);
      height: auto;
      animation: empurra 1.4s ease-in-out infinite;
    }
    @keyframes empurra {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(10px); }
    }

    #qr {
      flex: 0 0 auto;
      background: #fff;
      padding: min(2.6vh, 1.6vw);
      border-radius: 16px;
    }
    #qr img, #qr canvas { display: block; width: min(58vh, 36vw); height: auto; }

    .lado-qr {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5vh;
    }
    .frase {
      width: min(68vh, 42vw);
      text-align: center;
      color: var(--orange);
      font-weight: 600;
      font-size: min(3.4vh, 1.9vw);
      line-height: 1.25;
      letter-spacing: .02em;
    }

    .unidade-nome {
      font-size: min(2.4vh, 1.4vw);
      letter-spacing: .12em;
      color: var(--cream);
      opacity: .6;
    }
    .unidade-nome:empty { display: none; }

    /* Página geral */
    .geral-bloco { display: none; }
    body.geral .seta, body.geral .lado-qr { display: none; }
    body.geral .geral-bloco {
      display: flex;
      flex-direction: column;
      gap: 2vh;
      min-width: min(420px, 90vw);
    }
    .aviso { color: var(--orange); font-weight: 600; font-size: 22px; letter-spacing: .04em; }
    .lista { display: flex; flex-direction: column; gap: 10px; max-height: 70vh; overflow-y: auto; }
    .lista a {
      display: block;
      padding: 14px 18px;
      border: 2px solid var(--orange);
      border-radius: 10px;
      color: var(--cream);
      text-decoration: none;
      font-size: 20px;
      letter-spacing: .04em;
    }
    .lista a:hover { background: var(--orange); color: var(--bg); }

    /* Tablet em pé: empilha */
    @media (orientation: portrait) {
      main { flex-direction: column; gap: 2.5vh; text-align: center; }
      .titulo { align-items: center; }
      .fale { font-size: min(4vh, 7vw); }
      .dono { font-size: min(13vh, 24vw); }
      .faixa { font-size: min(2.4vh, 4.2vw); max-width: none; }
      .seta { flex-direction: row; gap: 2vw; }
      .seta span { font-size: min(4vh, 7vw); }
      .seta svg { width: min(6vh, 11vw); transform: rotate(90deg); animation-name: desce; }
      @keyframes desce {
        0%, 100% { transform: rotate(90deg) translateX(0); }
        50% { transform: rotate(90deg) translateX(8px); }
      }
      #qr img, #qr canvas { width: min(38vh, 70vw); }
      .lado-qr { gap: 2vh; }
      .frase { font-size: min(2.4vh, 4.4vw); width: min(56vh, 86vw); }
      .unidade-nome { font-size: min(1.8vh, 3.2vw); }
    }
  </style>
</head>
<body>
  <main>
    <div class="titulo">
      <span class="fale">Fale com o
        <svg viewBox="0 0 200 20" preserveAspectRatio="none" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 5 H150 C160 5 164 8 166 17 C169 8 176 5 186 5 H198" />
        </svg>
      </span>
      <span class="dono">Dono</span>
      <span class="faixa">Nos conte como foi a sua experiência</span>
    </div>

    <div class="seta" aria-hidden="true">
      <span>avalie aqui</span>
      <svg viewBox="0 0 120 60" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 30 H108" />
        <path d="M86 8 L110 30 L86 52" />
      </svg>
    </div>

    <div class="lado-qr">
      <div id="qr" role="img" aria-label="QR code da pesquisa de satisfação"></div>
      <p class="frase">Das reclamações aos elogios, gostaríamos de saber como podemos melhor lhe atender.</p>
      <span id="unidade-nome" class="unidade-nome"></span>
    </div>

    <!-- Página geral (sem unidade no endereço) -->
    <div class="geral-bloco">
      <p id="aviso" class="aviso">Escolha a unidade</p>
      <nav id="lista" class="lista"></nav>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    // =====================================================================
    //  LOJAS
    //  As lojas ficam no arquivo lojas.json (na mesma pasta deste index.html).
    //  Cada loja abre em: endereço-do-site/SLUG   (ex.: .../tambore)
    //  Para cadastrar uma loja, acrescente uma linha no lojas.json:
    //    { "slug": "mocca", "nome": "Shopping Mocca", "link": "https://..." }
    //  slug: só letras minúsculas, números e "-".  link: o link da pesquisa.
    // =====================================================================

    const normaliza = t => decodeURIComponent(t || "")
      .normalize("NFD").replace(/[̀-ͯ]/g, "")
      .toLowerCase().trim();

    // Endereço base do site (onde está este index.html):
    //  - usuario.github.io/NOME-DO-REPO/  -> 1 pasta antes da loja
    //  - *.pages.dev ou domínio próprio   -> nenhuma pasta
    const PASTAS_DO_SITE = /\.github\.io$/i.test(location.hostname) ? 1 : 0;
    const partes = location.pathname.split("/");
    const base = partes.slice(0, 1 + PASTAS_DO_SITE).join("/") + "/";
    const doCaminho = partes.slice(1 + PASTAS_DO_SITE).join("/").replace(/index\.html$/, "");

    // No Cloudflare, /tambore abre esta página direto (arquivo _redirects).
    // No GitHub Pages, o 404.html manda /tambore para cá como ?u=tambore;
    // aqui lemos a loja e voltamos o endereço bonito /tambore na barra.
    const doU = new URLSearchParams(location.search).get("u");
    const veio = (doU !== null ? doU : doCaminho).replace(/^\/+|\/+$/g, "");
    if (doU !== null) history.replaceState(null, "", base + veio + location.hash);

    const slug = normaliza(veio.split("/").pop());
    const temSlug = slug !== "";

    fetch(base + "lojas.json", { cache: "no-cache" })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(mostra)
      .catch(() => mostra(null));

    function mostra(lojas) {
      lojas = Array.isArray(lojas) ? lojas.filter(l => l && l.slug) : [];
      const loja = temSlug ? lojas.find(l => normaliza(String(l.slug)) === slug) : null;

      if (loja && loja.link) {
        document.title = "Fale com o dono | " + (loja.nome || "Camarada Camarão");
        document.getElementById("unidade-nome").textContent = loja.nome || "";
        new QRCode(document.getElementById("qr"), {
          text: loja.link,
          width: 600,
          height: 600,
          colorDark: "#1a1310",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
        return;
      }

      // Página geral: lista as lojas que já têm link
      document.body.classList.add("geral");
      const lista = document.getElementById("lista");
      const ativas = lojas.filter(l => l.link);
      const aviso = document.getElementById("aviso");
      if (loja) aviso.textContent = "Esta unidade ainda não foi configurada.";
      else if (temSlug) aviso.textContent = "Unidade não encontrada.";
      if (ativas.length && temSlug) aviso.textContent += " Escolha a unidade:";
      for (const l of ativas) {
        const a = document.createElement("a");
        a.href = base + encodeURIComponent(l.slug);
        a.textContent = l.nome || l.slug;
        lista.appendChild(a);
      }
    }
  </script>
</body>
</html>
